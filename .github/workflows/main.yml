name: Build Mofid Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses6 \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl

      - name: Install Rust
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf \
            https://sh.rustup.rs | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install cython==0.29.34

      - name: Install Kivy Garden Graph
        run: |
          python -m pip install kivy-garden
          python -m pip install "https://github.com/kivy-garden/graph/archive/refs/heads/master.zip"

      - name: Verify Garden Graph
        run: |
          python -c "from kivy_garden.graph import Graph, MeshLinePlot; print('Garden Graph OK')"

      - name: Build Android APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "1"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer android debug

      - name: Show generated APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MofidTracker-APK
          path: bin/*.apk
          if-no-files-found: error

name: Build Kivy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip openjdk-17-jdk autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer & Kivy (Virtual Env)
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install buildozer cython kivy
        
        # Add venv to the global path so subsequent steps can find 'buildozer'
        echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

    - name: Build APK (Debug Mode)
      run: |
        source venv/bin/activate
        # 'yes' command automatically accepts the Android SDK licenses
        yes | buildozer android debug
      env:
        # These flags help the compiler find the correct Java/SDK paths
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MofidApp-Android-Package
        path: bin/*.apk

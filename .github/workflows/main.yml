name: Build Kivy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the build with a button click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Get Buildozer Cache
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Build APK using Buildozer Cloud Engine
      uses: subho007/buildozer-action@v2
      with:
        command: buildozer android debug
        repository_root: .

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MofidApp-Android-Package
        path: bin/*.apk

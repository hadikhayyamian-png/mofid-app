name: Build Mofid Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncursesw5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      - name: Set Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.33"

      - name: Prepare Kivy Garden Graph
        run: |
          mkdir -p kivy_garden

          curl -L \
            https://github.com/kivy-garden/graph/archive/refs/heads/master.tar.gz \
            -o graph.tar.gz

          tar -xzf graph.tar.gz

          GRAPH_DIR=$(find . -maxdepth 1 -type d -name "graph-*")

          cp -R "$GRAPH_DIR" kivy_garden/graph

          touch kivy_garden/__init__.py

          rm -rf "$GRAPH_DIR"
          rm graph.tar.gz

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "1"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          yes | buildozer android debug

      - name: List APK
        if: always()
        run: |
          find bin -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MofidTracker-APK
          path: bin/*.apk

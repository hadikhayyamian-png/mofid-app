name: Build Kivy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build APK using Pre-Bundled Android SDK Engine
      uses: ArtemGovorov/buildozer-action@v1
      with:
        command: buildozer android debug
        # Forces the server to use a stable, cached compiler version
        buildozer_version: stable 
        repository_root: .

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MofidApp-Android-Package
        path: bin/*.apk

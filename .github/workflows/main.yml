name: Build Mofid Android APK

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kivy

      - name: Test application
        run: |
          python --version
          python -c "import kivy; print('Kivy OK:', kivy.__version__)"

  build:
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          yes | sdkmanager --licenses || true

      - name: Build Android APK
        env:
          P4A_RELEASE: "1"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          ACCEPT_ANDROID_SDK_LICENSE: "1"
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mofid-android-apk
          path: bin/*.apk
          if-no-files-found: error

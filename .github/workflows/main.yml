name: Build Kivy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup System Compilers
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        update-environment: true

    - name: Install Buildozer Dependencies
      run: |
        # Added --user flags to bypass cloud permission blocks safely
        python -m pip install --upgrade pip --user
        python -m pip install buildozer cython kivy --user
        # Append local user bin to system path so 'buildozer' command is recognized globally
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build Android APK with Buildozer
      run: |
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1" 

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MofidApp-Android-Package
        path: bin/*.apk

name: Build Mofid Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses6 \
            libncursesw6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython<3"

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "1"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer -v android debug

      - name: Show generated APK
        if: always()
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MofidTracker-APK
          path: bin/*.apk
          if-no-files-found: error

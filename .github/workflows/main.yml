name: Build Android APK

on:
  workflow_dispatch:      # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]     # also runs automatically on every push to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Build APK with Buildozer
        id: build
        continue-on-error: true
        run: buildozer -v android debug 2>&1 | tee build_full.log

      - name: Extract error summary
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== ERROR SUMMARY (last 60 lines around first error) ====="
          grep -n -i -E "error|Traceback|failed|fatal|exception" build_full.log | head -n 40 > build_errors.log || true
          cat build_errors.log
          echo "=============================================================="

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_full.log

      - name: Upload error summary
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-error-summary
          path: build_errors.log

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mofid-tracker-apk
          path: bin/*.apk

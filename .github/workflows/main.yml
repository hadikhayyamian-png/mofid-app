name: Build Kivy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup System Compilers
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer and Dependencies via Venv
      run: |
        # Creates an isolated environment to bypass all system environment and permission errors
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install cython kivy
        pip install git+https://github.com
        # Add the virtual environment binaries to the global execution path
        echo "$(pwd)/venv/bin" >> $GITHUB_PATH

    - name: Build Android APK with Buildozer
      run: |
        source venv/bin/activate
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1" 

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MofidApp-Android-Package
        path: bin/*.apk

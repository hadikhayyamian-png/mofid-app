name: Build Kivy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Crucial Fix: Tells GitHub's modern runner to safely bypass the Node security flag
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup System Compilers
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer Dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython kivy

    - name: Build Android APK with Buildozer
      run: |
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1" 

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MofidApp-Android-Package
        path: bin/*.apk
